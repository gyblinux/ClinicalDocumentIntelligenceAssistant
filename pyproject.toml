[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clinical-doc-assist"
version = "0.1.0"
description = "Practice clinical research discovery and evidence assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "openai>=1.99.1,<3",
    "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
clinical-doc-assist = "clinical_doc_assist.cli:main"
clinical-doc-discover = "clinical_doc_assist.research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_doc_assist"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
