name: clinical-doc-assist

services:
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - --model-id
      - BAAI/bge-small-en-v1.5
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - tei_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  tei_data:
  qdrant_data:
